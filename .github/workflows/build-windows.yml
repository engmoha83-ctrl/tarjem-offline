name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache converted models
        id: models
        uses: actions/cache@v4
        with:
          path: models
          key: ct2-opus-tc-big-v1-${{ hashFiles('scripts/convert_models.py') }}

      - name: Download and convert translation models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.40,<5" "ctranslate2>=4.4,<5" sentencepiece huggingface_hub sacremoses protobuf
          python scripts/convert_models.py

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Get llama.cpp for Windows (Vulkan + CPU)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rels = gh api "repos/ggml-org/llama.cpp/releases?per_page=30" | ConvertFrom-Json
          foreach ($kind in @("vulkan", "cpu")) {
            $pick = $null
            foreach ($r in $rels) { $a = $r.assets | Where-Object { $_.name -match "bin-win-$kind-x64\.zip$" } | Select-Object -First 1; if ($a) { $pick = @($r.tag_name, $a.name); break } }
            if (-not $pick) { throw "no llama.cpp win-$kind build found" }
            Write-Host "llama.cpp $kind -> $($pick[0]) / $($pick[1])"
            gh release download $pick[0] -R ggml-org/llama.cpp -p $pick[1] -O "$env:RUNNER_TEMP\llama-$kind.zip"
            Expand-Archive "$env:RUNNER_TEMP\llama-$kind.zip" "$env:RUNNER_TEMP\llama-$kind"
            $exe = Get-ChildItem -Recurse "$env:RUNNER_TEMP\llama-$kind" -Filter llama-server.exe | Select-Object -First 1
            New-Item -ItemType Directory -Force "llm\llama-$kind" | Out-Null
            Copy-Item "$($exe.DirectoryName)\*" "llm\llama-$kind" -Recurse
            # keep only what the server needs
            Get-ChildItem "llm\llama-$kind" -Filter *.exe | Where-Object { $_.Name -ne "llama-server.exe" } | Remove-Item
          }
          Get-ChildItem -Recurse llm | Measure-Object Length -Sum | ForEach-Object { "llm folder: {0:N0} MB" -f ($_.Sum/1MB) }

      - name: Cache accurate-mode model (test only, not shipped)
        uses: actions/cache@v4
        with:
          path: test-model
          key: gemma-3-4b-it-Q4_K_M-v1

      - name: Test accurate mode (CPU, real model)
        run: |
          if (-not (Test-Path test-model\gemma-3-4b-it-Q4_K_M.gguf)) {
            New-Item -ItemType Directory -Force test-model | Out-Null
            $m = Get-Content app\model.json -Raw | ConvertFrom-Json
            Invoke-WebRequest $m.url -OutFile test-model\gemma-3-4b-it-Q4_K_M.gguf
          }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\lad\Tarjem\models" | Out-Null
          Copy-Item test-model\gemma-3-4b-it-Q4_K_M.gguf "$env:RUNNER_TEMP\lad\Tarjem\models\"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\lad"
          python scripts/test_accurate.py

      - name: Self-test (translate sample sentences)
        run: python -m app.selftest

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --windowed --name Tarjem `
            --add-data "ui;ui" --add-data "app/model.json;app" `
            --collect-all ctranslate2 --collect-all sentencepiece --collect-all webview `
            --collect-all pythonnet --collect-all clr_loader `
            --exclude-module torch --exclude-module transformers --exclude-module tensorflow `
            app/main.py
          Copy-Item -Recurse models dist/Tarjem/models
          Copy-Item -Recurse llm dist/Tarjem/llm
          Get-ChildItem dist/Tarjem | Format-Table Name, Length

      - name: Smoke-test the packaged Tarjem.exe
        run: |
          # Simulate a zip downloaded from the internet: mark every DLL like Explorer does
          Get-ChildItem -Recurse dist\Tarjem -Include *.dll | ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          # Diagnostic: without the fix this is expected to fail like the user's machine did
          $env:TARJEM_NO_UNBLOCK = "1"
          $d = "$env:RUNNER_TEMP\exe-selftest-noblock.txt"
          $q = Start-Process -FilePath "dist\Tarjem\Tarjem.exe" -ArgumentList "--selftest", $d -PassThru
          if (-not $q.WaitForExit(120000)) { $q.Kill(); Write-Host "(timed out)" }
          Write-Host "--- without unblock (exit $($q.ExitCode)) ---"; Get-Content $d -Encoding utf8 -ErrorAction SilentlyContinue
          Remove-Item Env:TARJEM_NO_UNBLOCK
          Write-Host "--- with unblock ---"
          $out = "$env:RUNNER_TEMP\exe-selftest.txt"
          $p = Start-Process -FilePath "dist\Tarjem\Tarjem.exe" -ArgumentList "--selftest", $out -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Tarjem.exe self-test hung (an error dialog is probably open)" }
          Get-Content $out -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "Tarjem.exe self-test failed ($($p.ExitCode))" }

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.${{ github.run_number }}" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\tarjem.iss
          Compress-Archive -Path dist/Tarjem -DestinationPath "dist/Tarjem-Portable-$ver.zip"
          Get-ChildItem dist -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Tarjem-Windows
          path: |
            dist/Tarjem-Setup-*.exe
            dist/Tarjem-Portable-*.zip
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Build {0}', github.run_number) }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            dist/Tarjem-Setup-*.exe
            dist/Tarjem-Portable-*.zip
