name: Evaluate local LLMs

on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model:
          - unsloth/gemma-3-4b-it-GGUF
          - unsloth/gemma-3-12b-it-GGUF
          - unsloth/Qwen3-8B-GGUF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Get llama.cpp (CPU build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # newest release that actually ships an Ubuntu x64 CPU build
          gh api "repos/ggml-org/llama.cpp/releases?per_page=30" --jq '.[] | .tag_name as $t | .assets[] | select(.name | test("bin-ubuntu-x64\\.(tar\\.gz|zip)$")) | "\($t) \(.name)"' | head -1 > pick.txt
          cat pick.txt
          mkdir llama && cd llama
          if [ -s ../pick.txt ]; then
            read tag name < ../pick.txt
            gh release download "$tag" -R ggml-org/llama.cpp -p "$name" -O pkg
            (tar xzf pkg 2>/dev/null || unzip -q pkg)
          else
            echo "no prebuilt CPU build found - compiling llama-server"
            git clone --depth 1 https://github.com/ggml-org/llama.cpp src
            cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DGGML_NATIVE=ON
            cmake --build build --target llama-server -j 4
          fi
          find "$PWD" -name llama-server -type f | head -1 > ../server_path
          cat ../server_path
      - run: pip install huggingface_hub
      - name: Evaluate
        run: |
          S=$(realpath $(cat server_path)); export LD_LIBRARY_PATH=$(dirname "$S"):$LD_LIBRARY_PATH
          python scripts/eval_llm.py "$S" "${{ matrix.model }}"
